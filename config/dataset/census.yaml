_target_: src.datasets.dataset.Dataset
name: census
path: datasets/census/quality/private_data.csv
dcs:
  _target_: src.datasets.dcs.denial_constraints.DenialConstraints
  dcs:
    - _target_: src.datasets.dcs.denial_constraint.DenialConstraint
      constraint:  not(t1.AGEP=0&t2.AGEP=0&t1.SCHL=0&t2.SCHL!=0)
    - _target_: src.datasets.dcs.denial_constraint.DenialConstraint
      constraint:  not(t1.AGEP=0&t2.AGEP=0&t1.WAGP=0&t2.WAGP!=0)
    - _target_: src.datasets.dcs.denial_constraint.DenialConstraint
      constraint: not(t1.CIT=t2.CIT&t1.NATIVITY!=t2.NATIVITY)
    - _target_: src.datasets.dcs.denial_constraint.DenialConstraint
      constraint: not(t1.AGEP=0&t2.AGEP=0&t1.MAR=5&t2.MAR!=5)
    - _target_: src.datasets.dcs.denial_constraint.DenialConstraint
      constraint: not(t1.ST=t2.ST&t1.DIVISION!=t2.DIVISION)

target: WAGP